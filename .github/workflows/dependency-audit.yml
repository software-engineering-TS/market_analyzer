name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend and shared runtime dependencies
        run: pip-audit --strict -r requirements.txt
      - name: Audit Streamlit runtime dependencies
        working-directory: streamlit-app
        run: pip-audit --strict -r requirements.txt
